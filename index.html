.share-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.share-actions button{margin-top:0}.quiet-question{font-size:27px;line-height:1.35;font-weight:800;letter-spacing:-.04em;margin:26px 0 10px}.result-card-v6{position:relative;overflow:hidden;background:#053f35;color:#fff;border-radius:24px;padding:24px;margin:18px 0}.result-card-v6 .result-badge{display:inline-block;background:#b8ff18;color:#123b31;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900}.result-card-v6 .result-badge.not{background:#e4d9c9;color:#6b5b4d}.result-card-v6 .result-goal{font-size:23px;line-height:1.4;font-weight:800;margin:21px 0}.result-card-v6 .result-copy{font-size:13px;color:#e3efeb;line-height:1.7}.scene-public .flag-cloth{animation:plant-in 1.1s cubic-bezier(.2,.8,.3,1) both,flag-breathe 3.8s 1.1s ease-in-out infinite}.scene-done .flag-cloth{animation:flag-breathe 3.6s 1.4s ease-in-out infinite}.scene-done .tape-patch{filter:drop-shadow(0 3px 3px #8a662d2b)}

<body><main class="stage"><section class="intro"><div class="intro-lockup"><span class="brand-symbol brand-symbol-lg"><i class="bpole"></i><i class="bflag"></i><i class="btape"></i></span><div class="intro-lockup-text"><b>给个交代</b>立个 FLAG，给个交代。</div></div><div class="eyebrow">FLAG · SAY IT · DO IT · COME BACK</div><h1>立个 FLAG。<br>给个交代。</h1><p>把那件一直想做的事说清楚。<br>说出去，然后带着结果回来。</p><div class="steps"><span>写下这件事</span><span>把话说出去</span><span>带着结果回来</span></div><div class="preview-label">动效试映 · 不会更改你的 Flag</div><div class="motion-picks"><button onclick="previewMotion('plant')">↗ 立起来</button><button onclick="previewMotion('done')">✓ 站住了</button><button onclick="previewMotion('notdone')">↘ 没站住</button></div><p class="prototype-note">交互原型 · 不会真实扣款。</p></section><section class="device"><div class="island"></div><div class="status"><span>9:41</span><span>●●●　◖　▰</span></div><div class="app" id="app"></div></section></main><div class="toast" id="toast"></div>
<script>
const app=document.querySelector('#app'),storage=typeof localStorage!=='undefined'?localStorage:{getItem:()=>null,setItem:()=>{},removeItem:()=>{}},MAX_ACTIVE=2;let view='home',input='',editingGoal='',activeFlagId=null,flag=null,resultChoice='done';let flags=JSON.parse(storage.getItem('flagMvpFlags')||'null');if(!Array.isArray(flags)){const legacy=JSON.parse(storage.getItem('flagMvp')||'null');flags=legacy?[legacy]:[]}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),isoToday=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},isoAddDays=(base,n)=>{const d=new Date((base||isoToday())+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},fmt=s=>{if(!s)return'待确定';const d=new Date(s+'T00:00:00');return Number.isNaN(d.getTime())?String(s):d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})},short=s=>{if(!s)return'待确定';const d=new Date(s+'T00:00:00');return Number.isNaN(d.getTime())?String(s):d.toLocaleDateString('zh-CN',{month:'long',day:'numeric'})},today=()=>new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});
function toast(t){const x=document.querySelector('#toast');x.textContent=t;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),2200)}function current(){return flags.find(f=>f.id===activeFlagId)||flags[0]||null}function save(){storage.setItem('flagMvpFlags',JSON.stringify(flags));const c=current();if(c)storage.setItem('flagMvp',JSON.stringify(c))}function sync(f){if(!f||f.result)return;if(f.deadlineISO&&f.deadlineISO<isoToday())f.status='expired_pending';else if(!f.status||f.status==='expired_pending')f.status=f.public?'active_public':'active_private'}function active(){flags.forEach(sync);return flags.filter(f=>!f.__review&&!['done','not_done'].includes(f.result))}function userFlags(){return flags.filter(f=>!f.__review)}function setFlag(id){activeFlagId=id;flag=current();sync(flag)}function nav(){return'<div class="topbar"><div class="brand"><span class="brand-symbol"><i class="bpole"></i><i class="bflag"></i><i class="btape"></i></span><span class="brand-word">给个交代<small>立个 FLAG，给个交代</small></span></div><button class="review-link" onclick="go(\'review\')">预览</button><div class="avatar">林</div></div>'}function st(f){sync(f);if(f.result==='done')return'站住了';if(f.result==='not_done')return'没站住';if(f.status==='expired_pending')return'已到期 · 待处理';return f.public?'正在发生 · 公开':'正在发生 · 私人'}function pill(f){return`<span class="pill"><i class="dot" style="background:${f.status==='expired_pending'?'#d99062':f.public?'#84a832':'#a4a49b'}"></i>${esc(st(f))}</span>`}
let motionState='done';let sharedFlag=null;try{const m=location.hash.match(/#flag=([A-Za-z0-9+/=_-]+)/);if(m)sharedFlag=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))))}catch(e){sharedFlag=null}

function render(){active();flag=current();document.title=flags.some(f=>f.status==='expired_pending'&&!f.result)?'（待交代）给个交代':'给个交代';let h=nav();
if(view==='home'){const a=active();h+=a.length?`<div class="kicker">还在发生</div><div class="hero">你的 FLAG，<br>走到哪了？</div>${a.filter(f=>f.status==='expired_pending').map(f=>`<div class="status-note warn" role="button" tabindex="0" style="cursor:pointer" onclick="openFlag('${f.id}')"><b>到时间了。</b><br>${esc(f.goal)}<br>回来给个结果 →</div>`).join('')}<div class="section-row"><b>正在做</b><span>${a.length} / ${MAX_ACTIVE}</span></div>${a.map(f=>`<div class="card home-card" role="button" tabindex="0" onclick="openFlag('${f.id}')"><div class="flagmark">${pill(f)}<span>↗</span></div><div class="flagtitle" style="font-size:21px">${esc(f.goal)}</div><div class="meta"><span>◷ ${esc(short(f.deadlineISO))}</span><span>${f.logs?.length||0} 笔记录</span></div><div class="card-link">${f.status==='expired_pending'?'回来交代 →':'继续 →'}</div></div>`).join('')}${a.length<MAX_ACTIVE?`<button class="primary" onclick="startCreate()">${a.length?'再立一个':'立个 FLAG'}　↗</button>`:''}<div class="tabbar"><button class="current" onclick="go('home')">⌂ FLAG</button><button onclick="go('me')">◯ 我的 FLAG</button></div>`:`<div class="kicker">立个 FLAG，给个交代。</div><div class="guided-orbit"><div class="tiny-deco">先说一件真的</div><div class="question">有件事一直想做成，<br>还没做成？</div><p class="sub">或者有个目标，<br>一直没真正开始？</p>${scene('plant')}</div><button class="primary" onclick="startCreate()">有　→</button><button class="textbtn" onclick="toast('等真有一件想做成的事，再回来。')">现在没有</button><div class="mini-label slogan-lock">立个 FLAG，<em>给个交代</em>。</div><div class="tabbar"><button class="current" onclick="go('home')">⌂ FLAG</button><button onclick="go('me')">◯ 我的 FLAG</button></div>`}
if(view==='create')h+=`<button class="back" onclick="go('home')">← 返回</button><div class="micro-trail"><span class="on"></span><span></span><span></span></div><div class="kicker">先说出来</div><div class="question">你想把什么做成？</div><textarea id="goalInput" maxlength="60" placeholder="比如：把第一个收费产品上线。">${esc(input)}</textarea><button class="primary" onclick="captureGoal()">继续　→</button>`;
if(view==='clarify')h+=`<button class="back" onclick="go('create')">← 返回</button><div class="micro-trail"><span class="on"></span><span class="on"></span><span></span></div><div class="kicker">再说清楚一点</div><div class="ai-card"><div class="ai-label"><span>你想做成</span><span>FLAG</span></div>${esc(editingGoal||input)}</div><div class="question">做到什么，<br>才算做成？</div><textarea id="criteria" style="min-height:82px" placeholder="写下最后要拿出来的结果。">${esc(window.criteriaDraft||'')}</textarea><div class="question" style="font-size:24px;margin-top:25px">什么时候？</div><div class="date-help" style="margin-top:10px">选一个完成时间</div><div class="date-picks">${Array.from({length:45},(_,i)=>{const d=isoAddDays(isoToday(),i);return `<button class="date-pick ${window.deadlineDraft===d?'selected':''}" onclick="selectDate('${d}')"><small>${fmt(d).split('年')[1]?.replace('年','')||''}</small>${d.slice(5).replace('-', '月')}日</button>`}).join('')}</div><input id="clarifyDate" type="hidden" value="${esc(window.deadlineDraft||'')}"><div class="date-help">日期可直接点选，今天之前不会出现。</div><button class="primary" onclick="confirmGuidedFlag()">就这么定　→</button>`;
if(view==='detail'&&flag){sync(flag);const ex=flag.status==='expired_pending';h+=`<button class="back" onclick="go('home')">← 返回</button><div class="flagmark">${pill(flag)}<span class="muted">${flag.edits||0} 次调整</span></div><div class="flagtitle">${esc(flag.goal)}</div><div class="meta"><span>立下 · ${esc(flag.created||today())}</span><span>到期 · ${esc(short(flag.deadlineISO)||flag.deadline||'未设定')}</span></div>${ex?'<div class="status-note warn"><b>到时间了。</b><br>回来给个结果。</div>':''}<div class="card"><div class="section-title">做到什么算做成</div><div class="sub">${esc(flag.criteria||'由你自己认可的结果。')}</div></div>${!flag.public?`<button class="primary" onclick="go('upgrade')">说出去　→</button><button class="textbtn" onclick="editPrivate()">改一下</button>`:`${flag.paymentRecovery?'<div class="status-note warn"><b>支付状态没对上。</b><br>如果已经付过，别重复付。</div><button class="outline" onclick="recoverPayment()">恢复状态　↻</button>':''}<button class="primary" onclick="go('share')">让人知道　↗</button><button class="outline" onclick="go('invite')">发给 TA　＋</button><button class="outline" onclick="go('progress')">最近怎么样　＋</button><button class="outline" onclick="editPublic()">这句话要改吗</button><button class="outline" onclick="go('versions')">以前怎么说的</button><div class="section-title">这一路</div><div class="timeline">${(flag.logs||[]).map(x=>`<div class="event"><time>${esc(x.date)}</time>${esc(x.text)}${x.attachment?`<img class="attachment-thumb" src="${x.attachment}" alt="进展附件">`:''}</div>`).join('')||'<div class="muted">还没有记录。</div>'}</div><button class="dark" onclick="go('result')">回来交代　→</button>`}`}

function clarify(){input=document.querySelector('#goalInput').value.trim();if(!input)return toast('先写下一件你想完成的事');window.deadlineDraft=document.querySelector('#deadlineInput').value;window.regenIndex=0;window.criteriaDraft=suggestCriteria(0);editingGoal=(window.deadlineDraft?short(window.deadlineDraft)+'前，':'')+input.replace(/[。！!？?]$/,'')+'。';go('clarify')}function goalVariants(){const base=input.replace(/[。！!？?]$/,'');const dl=window.deadlineDraft?short(window.deadlineDraft)+'前':'';return [(dl?dl+'，':'')+base+'。','我会在'+(dl||'约定的时间')+'，完成这件事：'+base+'。',base+'。'+(dl?dl+'，':'')+'拿结果说话，不用借口收尾。']}function suggestCriteria(idx){const base=input.replace(/[。！!？?]$/,'');const dl=window.deadlineDraft?short(window.deadlineDraft):'截止日';const opts=['到'+dl+'，能拿出与「'+base+'」直接对应的成果（链接、文件、截图或实物），而不是口头说完成了。','核心部分全部完成才算做到；只完成一部分，就按实际比例记下来，不临时把标准调低。','见证人不用追问就能核对：有明确产物、有完成时间、能对照最初这句话一项项看。'];return opts[Math.abs(idx||0)%opts.length]}function regenerate(){window.regenIndex=(window.regenIndex||0)+1;const vs=goalVariants();editingGoal=vs[window.regenIndex%vs.length];window.criteriaDraft=suggestCriteria(window.regenIndex);const x=document.querySelector('#clarified');if(x)x.value=editingGoal;const c=document.querySelector('#criteria');if(c)c.value=window.criteriaDraft;toast('已换一种说法，完成标准也更具体了')}function confirmFlag(){const goal=document.querySelector('#clarified').value.trim();if(!goal)return toast('写下你的目标');if(active().length>=MAX_ACTIVE){toast('两件事都还没有结果，请先完成或结束一个');go('home');return}const d=document.querySelector('#clarifyDate').value;flag={id:Date.now().toString(),goal,original:input,criteria:document.querySelector('#criteria').value.trim(),deadlineISO:d||'',deadline:d?short(d):'待确定',created:today(),createdISO:isoToday(),publishedAt:'',public:false,status:'active_private',edits:0,logs:[]};flags.push(flag);activeFlagId=flag.id;save();go('privateSaved')}function editPrivate(){input=flag.original||flag.goal;editingGoal=flag.goal;window.criteriaDraft=flag.criteria||'';window.deadlineDraft=flag.deadlineISO||'';go('create')}function editPublic(){go('editGoal')}function saveEditedGoal(){const x=document.querySelector('#editGoalInput').value.trim(),reason=document.querySelector('#editReasonInput').value.trim();if(!x)return toast('先把调整后的说法写下来');if(!reason)return toast('公开后的调整，需要留下原因');if(x===flag.goal)return toast('内容没有变化');flag.edits=(flag.edits||0)+1;flag.versions=flag.versions||[];flag.versions.push({version:flag.edits,before:flag.goal,after:x,reason,at:today()});flag.logs.unshift({date:today()+' · 调整 '+flag.edits,text:'追加调整：'+x+'｜原因：'+reason});flag.goal=x;save();go('versions');toast('这一版作为调整记录留下了')}function pay(){toast('模拟支付处理中…');setTimeout(()=>{const at=today();flag.public=true;flag.status='active_public';flag.publishedAt=at;flag.publishedAtISO=new Date().toISOString();flag.publicId='FLAG-'+new Date().getFullYear()+'-'+String(flag.id).slice(-4).padStart(4,'0');flag.publicSnapshot={goal:flag.goal,deadlineISO:flag.deadlineISO,criteria:flag.criteria,publishedAt:at};flag.logs.unshift({date:at+' · 正式公开',text:'这句话正式留下来了'});save();go('published')},700)}function simulatePaymentRecovery(){if(!flag)return;flag.paymentRecovery=true;save();go('detail')}function recoverPayment(){toast('正在向服务端确认支付结果…');setTimeout(()=>{flag.paymentRecovery=false;flag.public=true;flag.status='active_public';save();render();toast('支付状态已恢复')},650)}function addProgress(){const t=document.querySelector('#progressInput').value.trim(),fileEl=document.querySelector('#progressFile'),file=fileEl&&fileEl.files&&fileEl.files[0];if(!t&&!file)return toast('写一句进展或附一张截图再保存');const saveLog=(attachment)=>{flag.logs.unshift({date:today(),text:t+(file?'｜附件：'+file.name:''),attachment});save();go('detail');toast('已留下')};if(file&&file.type.startsWith('image/')){const reader=new FileReader();reader.onload=()=>saveLog(reader.result);reader.readAsDataURL(file)}else saveLog('')}function chooseResult(type){resultChoice=type;go('resultForm')}function finishResult(){const text=document.querySelector('#resultInput').value.trim(),link=document.querySelector('#resultLink').value.trim(),fileEl=document.querySelector('#resultFile'),fileName=fileEl&&fileEl.files&&fileEl.files[0]?fileEl.files[0].name:'';if(resultChoice==='done'&&!text)return toast('“做到了”需要写下结果说明');if(resultChoice==='done'&&!link&&!fileName)return toast('至少留下一项成果链接、截图或文件');flag.result=resultChoice;flag.resultText=text;flag.resultEvidence=link||fileName||'';flag.resultAt=today();flag.status=resultChoice;flag.logs.unshift({date:today(),text:resultChoice==='done'?'给出结果：做到了':'给出结果：没做成'});save();go(resultChoice==='done'?'done':'not_done')}function flagLink(f){if(!f)return location.href.split('#')[0];const data={g:f.goal,d:f.deadlineISO||'',c:f.criteria||'',s:f.result||''};try{const enc=btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g,'-').replace(/\//g,'_');return location.href.split('#')[0]+'#flag='+enc}catch(e){return location.href.split('#')[0]}}function copyText(t,done){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast(done)).catch(()=>toast(done))}else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();toast(done)}}function shareTo(channel){const url=flagLink(flag);const text='我立了个 Flag：'+(flag?.goal||'');if(navigator.share){navigator.share({title:'给个交代 · 立个 FLAG，给个交代',text:text,url:url}).catch(()=>{})}else copyText(text+' '+url,'链接已复制，粘贴到微信发给 TA')}function sendInvite(){flag.witnessInvited=true;flag.logs.unshift({date:today()+' · 邀请见证人',text:'已发出见证邀请'});save();const url=flagLink(flag);const text='我立了个 Flag，想让你记着。等有了结果，再来找你。';if(navigator.share){navigator.share({title:'给个交代 · 立个 FLAG，给个交代',text:text,url:url}).catch(()=>{})}else copyText(text+' '+url,'邀请链接已复制，去发给 TA 吧');setTimeout(()=>go('share'),500)}function copyInviteLink(){copyText(flagLink(flag),'邀请链接已复制')}function downloadShareCard(){const goalText=String(flag?.goal||'我的 Flag').slice(0,8
