if(view==='resultForm'&&flag)h+=`<button class="back" onclick="go('result')">← 返回</button><div class="kicker" style="margin-top:28px">${resultChoice==='done'?'做到以后':'回来以后'}</div><div class="hero" style="font-size:28px">${resultChoice==='done'?'做到了。':'这次，没站住。'}</div><p class="sub">${resultChoice==='done'?'把结果留下。':'把话说完。'}</p><label class="field-label">结果说明${resultChoice==='done'?'（必填）':'（建议写）'}</label><textarea id="resultInput" placeholder="${resultChoice==='done'?'最后拿出了什么？':'后来发生了什么？'}"></textarea><label class="field-label">成果 / 证据${resultChoice==='done'?'（至少一种）':'（可选）'}</label><input class="field" id="resultLink" placeholder="成果链接，例如文章、作品、页面地址"><input class="field" id="resultFile" type="file" accept="image/*,.pdf" style="margin-top:9px"><div class="mini-label">原型只记录文件名；正式小程序会上传图片 / 截图 / 文件。</div><button class="primary" onclick="finishResult()">${resultChoice==='done'?'留下结果':'说完了'}　→</button>`;
if(view==='done'||view==='not_done'){const ok=view==='done';h+=`<div class="center">${scene(ok?'done':'notdone')}<button class="result-replay" onclick="render()">↻ 再看一遍</button><div class="kicker"><span class="tape-accent">给个交代</span></div><div class="hero" style="font-size:32px">${ok?'站住了。':'这次，没站住。'}</div><p class="sub">${ok?'这就是交代。':'但你回来了。'}</p></div><div class="share-preview"><div class="kicker">${ok?'我说过 · 我做到了':'这次的交代'}</div><div class="flagtitle">${esc(flag?.goal||'我的 Flag')}</div><div class="meta"><span>立于 ${esc(flag?.created||today())}</span><span>${esc(flag?.resultAt||today())} · ${ok?'站住了':'没站住'}</span></div>${flag?.resultText?`<div class="divider" style="background:#53544a"></div><div class="sub" style="color:#e3e4d9">${esc(flag.resultText)}</div>`:''}${flag?.resultEvidence?`<div class="divider" style="background:#53544a"></div><div class="sub" style="color:#d9f36a">证据：${esc(flag.resultEvidence)}</div>`:''}</div><div class="status-note"><b>已结案 · 只读</b><br>这次交代已经封存。原始公开承诺、过程记录与结果不会再被覆盖。</div>${ok?'<button class="primary" onclick="shareResult()">让他们看看　↗</button>':'<button class="primary" onclick="go(&quot;me&quot;)">说完了　→</button><button class="textbtn" onclick="shareResult()">也把这个结果说出去　↗</button>'}<button class="${ok?'textbtn':'outline'}" onclick="go('home')">回去看看　→</button>`}
if(view==='motionPreview')h+=`<button class="back" onclick="go('home')">← 返回原型</button><div class="kicker" style="margin-top:22px">动效试映 · 不改变记录</div>${scene(motionState)}<div class="center"><div class="hero" style="font-size:31px">${motionState==='done'?'站住了。':motionState==='notdone'?'这次，没站住。':'立下了。先不声张。'}</div><p class="sub">${motionState==='done'?'这就是交代。':motionState==='notdone'?'但你回来了。':'这句话，现在有了自己的位置。'}</p></div><div class="motion-picks"><button class="${motionState==='plant'?'selected':''}" onclick="previewMotion('plant')">↗ 立起来</button><button class="${motionState==='done'?'selected':''}" onclick="previewMotion('done')">✓ 站住了</button><button class="${motionState==='notdone'?'selected':''}" onclick="previewMotion('notdone')">↘ 没站住</button></div><button class="outline" onclick="render()">↻ 再看一遍</button><div class="outcome-note">${motionState==='done'?'一端贴住，再压平。把这次交代留下来。':motionState==='notdone'?'轻轻放倒，不抹掉走过的这段。':'立起是开始，带着结果回来才算交代。'}</div>`;
if(view==='editGoal'&&flag)h+=`<button class="back" onclick="go('detail')">← 返回 Flag</button><div class="kicker" style="margin-top:25px">改一句，留一版</div><div class="hero" style="font-size:28px">改的是这句，<br>不是过去。</div><p class="sub">第一次公开的原话会一直留着。这次修改会记为第 ${(flag.edits||0)+1} 版，写在版本记录里。</p><label class="field-label">调整后的说法</label><textarea id="editGoalInput" maxlength="80">${esc(flag.goal)}</textarea><label class="field-label">为什么调整（必填）</label><textarea id="editReasonInput" style="min-height:72px" placeholder="说明发生了什么。首次公开承诺不会被覆盖。"></textarea><div class="snapshot"><b>首次公开承诺 · 永久保留</b><small>${esc(flag.publicSnapshot?.goal||flag.goal)}</small></div><button class="primary" onclick="saveEditedGoal()">追加这一版　→</button><button class="textbtn" onclick="go('detail')">不改了</button>`;
if(view==='versions'&&flag)h+=`<button class="back" onclick="go('detail')">← 返回 Flag</button><div class="kicker" style="margin-top:25px">版本记录</div><div class="hero" style="font-size:28px">每一版，<br>都在这里。</div><p class="sub">首次公开承诺不会被替换。后续每一次调整，都作为追加版本留下原因和时间。</p><div class="card"><div class="section-title">首次公开 · 第 1 版</div><div class="sub">${esc(flag.publicSnapshot?.goal||flag.goal)}</div><div class="meta"><span>公开于 ${esc(flag.publicSnapshot?.publishedAt||flag.publishedAt||flag.created)}</span></div></div>${(flag.versions||[]).slice().reverse().map(v=>`<div class="card"><div class="section-title">第 ${v.version+1} 版 · ${esc(v.at)}</div><div class="muted" style="text-decoration:line-through">${esc(v.before)}</div><div class="sub" style="margin-top:6px">${esc(v.after)}</div>${v.reason?`<div class="muted" style="margin-top:8px">调整原因：${esc(v.reason)}</div>`:''}</div>`).join('')||'<p class="home-note">还没有改过。改的第一版，会出现在这里。</p>'}`;
if(view==='me')h+=`<div class="kicker" style="margin-top:24px">MY FLAGS</div><div class="hero" style="font-size:30px">Flag 簿</div><div class="card"><div class="section-title">还在发生</div>${active().map(f=>`<div class="event" style="margin:14px 0;cursor:pointer" onclick="openFlag('${f.id}')">${esc(f.goal)}<time>${esc(st(f))}</time></div>`).join('')||'<div class="muted">现在没有必须完成的事。真有一件非做不可的事时，再回来。</div>'}</div><div class="card"><div class="section-title">有了交代</div>${flags.filter(f=>['done','not_done'].includes(f.result)).map(f=>`<div class="event" style="margin:14px 0;cursor:pointer" onclick="openFlag('${f.id}')">${esc(f.goal)}<time>${f.result==='done'?'站住了':'没站住'}</time></div>`).join('')||'<div class="muted">等你带着第一个结果回来。</div>'}</div><button class="outline" onclick="resetDemo()">重置原型体验</button><div class="tabbar"><button onclick="go('home')">⌂ 立 Flag</button><button class="current" onclick="go('me')">◯ Flag 簿</button></div>`;app.innerHTML=h}
function go(v){view=v;render();app.scrollTop=0}function startCreate(){if(active().length>=MAX_ACTIVE){toast('两个 Flag 都在进行中，请先完成或结束一个');return}input='';editingGoal='';window.deadlineDraft='';flag=null;go('create')}function openFlag(id){setFlag(id);go(flag.result==='done'?'done':flag.result==='not_done'?'not_done':'detail')}function captureGoal(){input=document.querySelector('#goalInput').value.trim();if(!input)return toast('先说一个你想做成的目标');editingGoal=input.replace(/[。！!？?]$/,'')+'。';window.criteriaDraft='';window.deadlineDraft='';go('clarify')}function confirmGuidedFlag(){const criteria=document.querySelector('#criteria').value.trim(),d=document.querySelector('#clarifyDate').value;if(!criteria)return toast('先说清楚，做到什么才算做成');if(!d)return toast('给它一个完成时间');if(active().length>=MAX_ACTIVE)return toast('已经有两面 Flag 在路上了');flag={id:Date.now().toString(),goal:editingGoal||input,original:input,criteria,deadlineISO:d,deadline:short(d),created:today(),createdISO:isoToday(),publishedAt:'',public:false,status:'active_private',edits:0,logs:[]};flags.push(flag);activeFlagId=flag.id;save();go('privateSaved')}function clarify(){input=document.querySelector('#goalInput').value.trim();if(!input)return toast('先写下一件你想完成的事');window.deadlineDraft=document.querySelector('#deadlineInput').value;window.regenIndex=0;window.criteriaDraft=suggestCriteria(0);editingGoal=(window.deadlineDraft?short(window.deadlineDraft)+'前，':'')+input.replace(/[。！!？?]$/,'')+'。';go('clarify')}function goalVariants(){const base=input.replace(/[。！!？?]$/,'');const dl=window.deadlineDraft?short(window.deadlineDraft)+'前':'';return [(dl?dl+'，':'')+base+'。','我会在'+(dl||'约定的时间')+'，完成这件事：'+base+'。',base+'。'+(dl?dl+'，':'')+'拿结果说话，不用借口收尾。']}function suggestCriteria(idx){const base=input.replace(/[。！!？?]$/,'');const dl=window.deadlineDraft?short(window.deadlineDraft):'截止日';const opts=['到'+dl+'，能拿出与「'+base+'」直接对应的成果（链接、文件、截图或实物），而不是口头说完成了。','核心部分全部完成才算做到；只完成一部分，就按实际比例记下来，不临时把标准调低。','见证人不用追问就能核对：有明确产物、有完成时间、能对照最初这句话一项项看。'];return opts[Math.abs(idx||0)%opts.length]}function regenerate(){window.regenIndex=(window.regenIndex||0)+1;const vs=goalVariants();editingGoal=vs[window.regenIndex%vs.length];window.criteriaDraft=suggestCriteria(window.regenIndex);const x=document.querySelector('#clarified');if(x)x.value=editingGoal;const c=document.querySelector('#criteria');if(c)c.value=window.criteriaDraft;toast('已换一种说法，完成标准也更具体了')}function confirmFlag(){const goal=document.querySelector('#clarified').value.trim();if(!goal)return toast('写下你的目标');if(active().length>=MAX_ACTIVE){toast('两件事都还没有结果，请先完成或结束一个');go('home');return}const d=document.querySelector('#clarifyDate').value;flag={id:Date.now().toString(),goal,original:input,criteria:document.querySelector('#criteria').value.trim(),deadlineISO:d||'',deadline:d?short(d):'待确定',created:today(),createdISO:isoToday(),publishedAt:'',public:false,status:'active_private',edits:0,logs:[]};flags.push(flag);activeFlagId=flag.id;save();go('privateSaved')}function editPrivate(){input=flag.original||flag.goal;editingGoal=flag.goal;window.deadlineDraft=flag.deadlineISO||'';go('create')}function editPublic(){go('editGoal')}function saveEditedGoal(){const x=document.querySelector('#editGoalInput').value.trim(),reason=document.querySelector('#editReasonInput').value.trim();if(!x)return toast('先把调整后的说法写下来');if(!reason)return toast('公开后的调整，需要留下原因');if(x===flag.goal)return toast('内容没有变化');flag.edits=(flag.edits||0)+1;flag.versions=flag.versions||[];flag.versions.push({version:flag.edits,before:flag.goal,after:x,reason,at:today()});flag.logs.unshift({date:today()+' · 调整 '+flag.edits,text:'追加调整：'+x+'｜原因：'+reason});flag.goal=x;save();go('versions');toast('这一版作为调整记录留下了')}function pay(){toast('模拟支付处理中…');setTimeout(()=>{const at=today();flag.public=true;flag.status='active_public';flag.publishedAt=at;flag.publishedAtISO=new Date().toISOString();flag.publicId='FLAG-'+new Date().getFullYear()+'-'+String(flag.id).slice(-4).padStart(4,'0');flag.publicSnapshot={goal:flag.goal,deadlineISO:flag.deadlineISO,criteria:flag.criteria,publishedAt:at};flag.logs.unshift({date:at+' · 正式公开',text:'这句话正式留下来了'});save();go('published')},700)}function simulatePaymentRecovery(){if(!flag)return;flag.paymentRecovery=true;save();go('detail')}function recoverPayment(){toast('正在向服务端确认支付结果…');setTimeout(()=>{flag.paymentRecovery=false;flag.public=true;flag.status='active_public';save();render();toast('支付状态已恢复')},650)}function addProgress(){const t=document.querySelector('#progressInput').value.trim();if(!t)return toast('写一句进展再保存');flag.logs.unshift({date:today(),text:t});save();go('detail');toast('已留下')}function chooseResult(type){resultChoice=type;go('resultForm')}function finishResult(){const text=document.querySelector('#resultInput').value.trim(),link=document.querySelector('#resultLink').value.trim(),fileEl=document.querySelector('#resultFile'),fileName=fileEl&&fileEl.files&&fileEl.files[0]?fileEl.files[0].name:'';if(resultChoice==='done'&&!text)return toast('“做到了”需要写下结果说明');if(resultChoice==='done'&&!link&&!fileName)return toast('至少留下一项成果链接、截图或文件');flag.result=resultChoice;flag.resultText=text;flag.resultEvidence=link||fileName||'';flag.resultAt=today();flag.status=resultChoice;flag.logs.unshift({date:today(),text:resultChoice==='done'?'给出结果：做到了':'给出结果：没做到'});save();go(resultChoice==='done'?'done':'not_done')}function flagLink(f){if(!f)return location.href.split('#')[0];const data={g:f.goal,d:f.deadlineISO||'',c:f.criteria||'',s:f.result||''};try{const enc=btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g,'-').replace(/\//g,'_');return location.href.split('#')[0]+'#flag='+enc}catch(e){return location.href.split('#')[0]}}function copyText(t,done){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast(done)).catch(()=>toast(done))}else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();toast(done)}}function shareTo(channel){const url=flagLink(flag);const text='我立了个 Flag：'+(flag?.goal||'');if(navigator.share){navigator.share({title:'给个交代 · 立个 FLAG，给个交代',text:text,url:url}).catch(()=>{})}else copyText(text+' '+url,'链接已复制，粘贴到微信发给 TA')}function sendInvite(){flag.witnessInvited=true;flag.logs.unshift({date:today()+' · 邀请见证人',text:'已发出见证邀请'});save();const url=flagLink(flag);const text='我立了个 Flag，想让你记着。等有了结果，再来找你。';if(navigator.share){navigator.share({title:'给个交代 · 立个 FLAG，给个交代',text:text,url:url}).catch(()=>{})}else copyText(text+' '+url,'邀请链接已复制，去发给 TA 吧');setTimeout(()=>go('share'),500)}function copyInviteLink(){copyText(flagLink(flag),'邀请链接已复制')}function downloadShareCard(){const goalText=String(flag?.goal||'我的 Flag').slice(0,80);const c=document.createElement('canvas');c.width=900;c.height=1120;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,900,1120);g.addColorStop(0,'#252620');g.addColorStop(1,'#414638');x.fillStyle=g;x.fillRect(0,0,900,1120);x.fillStyle='#d9f36a';x.font='700 26px sans-serif';x.fillText('给个交代  ·  FLAG',72,94);x.font='54px sans-serif';x.fillText('⚑',770,100);function wrap(text,size){x.font='700 '+size+'px sans-serif';const lines=[];let line='';for(const ch of Array.from(text)){const t=line+ch;if(x.measureText(t).width>740&&line){lines.push(line);line=ch}else line=t}if(line)lines.push(line);return lines}let size=56,lines=wrap(goalText,size);while(lines.length>4&&size>32){size-=6;lines=wrap(goalText,size)}if(lines.length>5){lines=lines.slice(0,5);lines[4]=lines[4].replace(/.$/,'…')}x.fillStyle='#fff';const lh=Math.round(size*1.45);let y=315;lines.forEach((ln,i)=>{x.fillText(ln,72,y+i*lh)});y=y+lines.length*lh+36;x.strokeStyle='#62645a';x.beginPath();x.moveTo(72,y);x.lineTo(828,y);x.stroke();x.fillStyle='#d9dacf';x.font='30px sans-serif';x.fillText('截止 '+(flag?.deadline||'待确定'),72,y+70);x.fillText(flag?.result==='done'?'我说过。我做到了。':flag?.result==='not_done'?'没站住，也有交代。':'到时候，给个交代。',72,y+130);x.fillStyle='#d9f36a';x.font='24px sans-serif';x.fillText('立个 FLAG，给个交代。',72,1030);const a=document.createElement('a');a.download='my-flag-share.png';a.href=c.toDataURL('image/png');a.click();toast('分享卡已保存，可手动发布到朋友圈或抖音')}function shareResult(){go('share')}function resetDemo(){if(confirm('清除本原型保存的数据，并从头体验？')){storage.removeItem('flagMvp');storage.removeItem('flagMvpFlags');flags=[];flag=null;activeFlagId=null;go('home')}}setInterval(()=>{const before=flags.map(f=>f.status).join('|');flags.forEach(sync);if(flags.map(f=>f.status).join('|')!==before){save();render()}},60000);
render();
